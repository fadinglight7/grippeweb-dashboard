<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GrippeWeb – Inzidenz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #ffffff;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        #chart {
            width: 100%;
            height: 600px;
        }
    </style>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>


</head>

<body>

    <h1>GrippeWeb – Inzidenz</h1>

    <div id="controls">

    <label for="seasonFilter">
        Season:
    </label>

    <select id="seasonFilter" multiple size="6">
    </select>

</div>

<div id="chart"></div>




<script>
    const TSV_URL =
        "https://raw.githubusercontent.com/fadinglight7/grippeweb-dashboard/main/GrippeWeb_Daten_des_Wochenberichts.tsv";

    fetch(TSV_URL)
        .then(response => response.text())
        .then(tsvText => {

            const lines =
                tsvText.trim().split(/\r?\n/);

            const headers =
                lines[0].split("\t");

            const rows =
                lines.slice(1).map(line => {

                    const values =
                        line.split("\t");

                    const row = {};

                    headers.forEach(
                        (header, index) => {
                            row[header] =
                                values[index] ?? "";
                        }
                    );

                    return row;
                });

            console.log("TSV loaded:", rows.length);
            console.log("First row:", rows[0]);

            const seasonFilter =
    document.getElementById("seasonFilter");

const seasons = [
    ...new Set(
        rows.map(row => row.Saison)
    )
].sort();

seasons.forEach(season => {

    const option =
        document.createElement("option");

    option.value = season;
    option.textContent = season;

    seasonFilter.appendChild(option);
});

console.log("Seasons:", seasons);

        })
        .catch(error => {
            console.error(
                "Error loading TSV:",
                error
            );
        });
</script>

</body>
</html>
