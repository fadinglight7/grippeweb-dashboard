<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GrippeWeb – Inzidenz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #ffffff;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        #chart {
            width: 100%;
            height: 600px;
        }

        #controls {
    margin-bottom: 20px;
}

.season-dropdown {
    position: relative;
    display: inline-block;
}

#seasonDropdownButton {
    min-width: 180px;
    padding: 8px 12px;
    background: white;
    border: 1px solid #999;
    border-radius: 3px;
    text-align: left;
    cursor: pointer;
}

.season-dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 180px;
    max-height: 250px;
    overflow-y: auto;
    background: white;
    border: 1px solid #999;
    z-index: 1000;
}

.season-dropdown-menu.show {
    display: block;
}

.season-option {
    display: block;
    padding: 6px 10px;
    cursor: pointer;
}

.season-option:hover {
    background: #f0f0f0;
}


    </style>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>


</head>

<body>

    <h1>GrippeWeb – Inzidenz</h1>

    <div id="controls">

    <div class="season-dropdown">

        <button
            type="button"
            id="seasonDropdownButton"
        >
            2025/26
        </button>

        <div
            id="seasonDropdownMenu"
            class="season-dropdown-menu"
        >
        </div>

    </div>

</div>

<div id="chart"></div>




<script>
    const TSV_URL =
        "https://raw.githubusercontent.com/fadinglight7/grippeweb-dashboard/main/GrippeWeb_Daten_des_Wochenberichts.tsv";

    fetch(TSV_URL)
        .then(response => response.text())
        .then(tsvText => {

            const lines =
                tsvText.trim().split(/\r?\n/);

            const headers =
                lines[0].split("\t");

            const rows =
                lines.slice(1).map(line => {

                    const values =
                        line.split("\t");

                    const row = {};

                    headers.forEach(
                        (header, index) => {
                            row[header] =
                                values[index] ?? "";
                        }
                    );

                    return row;
                });

            console.log("TSV loaded:", rows.length);
            console.log("First row:", rows[0]);

            const seasonDropdownButton =
    document.getElementById(
        "seasonDropdownButton"
    );

const seasonDropdownMenu =
    document.getElementById(
        "seasonDropdownMenu"
    );

const seasons = [
    ...new Set(
        rows.map(row => row.Saison)
    )
].sort();

seasons.forEach(season => {

    const label =
        document.createElement("label");

    label.className =
        "season-option";

    const checkbox =
        document.createElement("input");

    checkbox.type = "checkbox";
    checkbox.value = season;

    if (season === "2025/26") {
        checkbox.checked = true;
    }

    label.appendChild(checkbox);

    const text =
        document.createTextNode(
            " " + season
        );

    label.appendChild(text);

    seasonDropdownMenu.appendChild(label);
});

function updateSeasonButton() {

    const selected = [
        ...seasonDropdownMenu.querySelectorAll(
            'input[type="checkbox"]:checked'
        )
    ];

    if (selected.length === 0) {

        seasonDropdownButton.textContent =
            "Select season";

    } else if (selected.length === 1) {

        seasonDropdownButton.textContent =
            selected[0].value;

    } else {

        seasonDropdownButton.textContent =
            "Multiple seasons";
    }
}

seasonDropdownMenu
    .addEventListener("change", updateSeasonButton);

seasonDropdownButton
    .addEventListener("click", function() {

        seasonDropdownMenu.classList.toggle(
            "show"
        );
    });

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".season-dropdown"
            )
        ) {
            seasonDropdownMenu.classList.remove(
                "show"
            );
        }
    }
);

updateSeasonButton();

console.log("Seasons:", seasons);

        })
        .catch(error => {
            console.error(
                "Error loading TSV:",
                error
            );
        });
</script>

</body>
</html>
