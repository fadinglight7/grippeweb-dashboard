<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GrippeWeb – Inzidenz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #ffffff;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        #chart {
            width: 100%;
            height: 600px;
        }
    </style>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>


</head>

<body>

    <h1>GrippeWeb – Inzidenz</h1>

    <div id="chart"></div>




<script>
    const data = [{
        x: ["W40", "W41", "W42", "W43"],
        y: [1000, 1500, 1200, 1800],
        type: "scatter",
        mode: "lines+markers",
        name: "Test Season"
    }];

    const layout = {
        title: "Test Incidence Chart",
        xaxis: {
            title: "Kalenderwoche"
        },
        yaxis: {
            title: "Inzidenz"
        }
    };

    Plotly.newPlot("chart", data, layout, {
        responsive: true
    });
</script>

</body>
</html>
